name: Keep Render Awake

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          echo "Pinging Master XCloud backend..."
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            https://master-xcloud-web.onrender.com/health
          echo
          echo "Render backend respondeu com sucesso."
