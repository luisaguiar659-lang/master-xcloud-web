name: Keep Render Awake

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          echo "Pinging Master XCloud backend..."
          curl --fail --silent --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 45 \
            --header "Cache-Control: no-cache" \
            --user-agent "Master-XCloud-KeepAlive/1.0" \
            https://master-xcloud-web.onrender.com/health
          echo
          echo "Render backend respondeu com sucesso."
