name: Build MASTER XCLOUD APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-master-xcloud-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validar chave oficial de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ]
          [ -n "$STORE_PASSWORD" ]
          [ -n "$KEY_ALIAS" ]
          [ -n "$KEY_PASSWORD" ]

      - name: Preparar chave oficial
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf "%s" "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/master-xcloud-release.jks"

      - name: Compilar APK release assinado
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/master-xcloud-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Preparar APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -type f -name '*.apk' ! -name '*unsigned*' | head -1)
          [ -n "$APK" ]
          cp "$APK" MASTER-XCLOUD.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MASTER-XCLOUD-v0.5.0-MOBILE-NATIVE-SIGNED
          path: MASTER-XCLOUD.apk
          retention-days: 30
