name: Build MASTER XCLOUD APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-master-xcloud-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK debug
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MASTER-XCLOUD.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MASTER-XCLOUD-v0.1.0
          path: MASTER-XCLOUD.apk
          retention-days: 30
